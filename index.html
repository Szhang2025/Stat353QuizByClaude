<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAT 353 &mdash; Problem Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.4/jstat.min.js"></script>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['\\[', '\\]']]
    },
    options: {
      skipHtmlTags: ['script','noscript','style','textarea','pre','code']
    },
    startup: {
      typeset: false
    }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js" id="MathJax-script" async></script>
<style>
  mjx-container{font-size:104% !important;}
  .qtext mjx-container, .review-card mjx-container{margin:0 2px;}
  :root{
    --ink:#1c2333;
    --ink-soft:#4a5268;
    --paper:#eef1f5;
    --paper-card:#ffffff;
    --line:#d7dde6;
    --accent:#1f6f78;
    --accent-dark:#154e55;
    --gold:#c8912e;
    --good:#2f7a4f;
    --good-bg:#e7f4ec;
    --bad:#b4453b;
    --bad-bg:#fbebe9;
    --radius:10px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(rgba(31,111,120,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(31,111,120,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Fraunces',serif; color:var(--ink); margin:0 0 0.4em 0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:var(--accent);}

  /* ---------- Password screen ---------- */
  #passwordScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .pw-card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 8px 30px rgba(28,35,51,0.08);
    padding:40px 36px;
    max-width:420px;
    width:100%;
    text-align:center;
  }
  .pw-card .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-size:0.72rem;
    color:var(--accent);
    margin-bottom:10px;
  }
  .pw-card h1{font-size:1.6rem; margin-bottom:6px;}
  .pw-card p.sub{color:var(--ink-soft); font-size:0.92rem; margin:0 0 24px 0;}
  #pwInput{
    width:100%;
    padding:12px 14px;
    font-size:1rem;
    font-family:'IBM Plex Mono',monospace;
    border:1.5px solid var(--line);
    border-radius:8px;
    outline:none;
    margin-bottom:14px;
  }
  #pwInput:focus{border-color:var(--accent);}
  .btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px 22px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    border-radius:8px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .btn:hover{background:var(--accent-dark);}
  .btn:disabled{opacity:0.55; cursor:not-allowed;}
  .btn-full{width:100%;}
  .btn-secondary{
    background:transparent;
    color:var(--accent);
    border:1.5px solid var(--accent);
  }
  .btn-secondary:hover{background:rgba(31,111,120,0.08);}
  #pwError{color:var(--bad); font-size:0.85rem; min-height:1.2em; margin-top:4px;}
  #pwNote{font-size:0.78rem; color:var(--ink-soft); margin-top:18px; line-height:1.5;}

  /* ---------- App shell ---------- */
  #app{display:none; min-height:100vh;}
  .shell{
    display:flex;
    max-width:1180px;
    margin:0 auto;
    min-height:100vh;
  }
  .sidebar{
    width:280px;
    flex-shrink:0;
    padding:28px 14px 28px 20px;
    border-right:1px solid var(--line);
  }
  .brand{margin-bottom:22px;}
  .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-size:0.68rem;
    color:var(--accent);
  }
  .brand h1{font-size:1.35rem; line-height:1.2;}
  nav.topics{display:flex; flex-direction:column; gap:2px;}
  .topic-btn{
    display:flex;
    align-items:baseline;
    gap:10px;
    text-align:left;
    background:transparent;
    border:none;
    padding:9px 10px;
    border-radius:7px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:0.87rem;
    color:var(--ink-soft);
    width:100%;
  }
  .topic-btn .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--accent);
    min-width:20px;
  }
  .topic-btn:hover{background:rgba(31,111,120,0.08); color:var(--ink);}
  .topic-btn.active{background:var(--accent); color:#fff;}
  .topic-btn.active .num{color:#cfe9e6;}

  main{flex:1; padding:32px 40px; min-width:0;}
  .topic-header{margin-bottom:6px;}
  .topic-header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.1em;
    text-transform:uppercase;
    font-size:0.7rem;
    color:var(--accent);
  }
  .topic-header h2{font-size:1.7rem; margin-top:4px;}
  .review-card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:var(--radius);
    padding:20px 24px;
    margin:18px 0 26px 0;
    font-size:0.94rem;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .review-card p{margin:0 0 10px 0;}
  .review-card p:last-child{margin-bottom:0;}
  .review-card ul{margin:6px 0; padding-left:20px;}
  .review-card strong{color:var(--ink);}

  .problems-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .problems-header h3{font-size:1.05rem; font-family:'Inter',sans-serif; font-weight:700; color:var(--ink);}

  .problem-card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 22px;
    margin-bottom:14px;
  }
  .problem-card .pnum{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.75rem;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:6px;
  }
  .problem-card .qtext{font-size:0.98rem; line-height:1.55; margin-bottom:14px;}
  .answer-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .answer-row input[type=text]{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.95rem;
    padding:9px 12px;
    border:1.5px solid var(--line);
    border-radius:7px;
    width:160px;
    outline:none;
  }
  .answer-row input[type=text]:focus{border-color:var(--accent);}
  .btn-sm{padding:9px 16px; font-size:0.87rem;}
  .feedback{
    margin-top:10px;
    font-size:0.88rem;
    padding:8px 12px;
    border-radius:7px;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:var(--good-bg); color:var(--good);}
  .feedback.bad{background:var(--bad-bg); color:var(--bad);}

  .mc-choices{display:flex; flex-direction:column; gap:8px;}
  .mc-choice{
    text-align:left;
    background:#fbfcfd;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:10px 14px;
    font-family:'Inter',sans-serif;
    font-size:0.92rem;
    cursor:pointer;
    color:var(--ink);
    transition:border-color .12s ease, background .12s ease;
  }
  .mc-choice:hover{border-color:var(--accent);}
  .mc-choice.correct{background:var(--good-bg); border-color:var(--good); color:var(--good);}
  .mc-choice.incorrect{background:var(--bad-bg); border-color:var(--bad); color:var(--bad);}
  .mc-choice[disabled]{cursor:default;}

  .topbar-actions{display:flex; gap:10px; margin:8px 0 24px 0;}

  /* ---------- Review header + examples button ---------- */
  .review-actions{display:flex; justify-content:flex-end; margin-bottom:8px;}
  .btn-examples{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:#fff;
    color:var(--accent-dark);
    border:1.5px solid var(--accent);
    padding:8px 15px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.82rem;
    border-radius:8px;
    cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .btn-examples:hover{background:var(--accent); color:#fff;}
  .btn-examples .ico{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%;
    border:1.5px solid currentColor;
    font-family:'Fraunces',serif; font-style:italic; font-size:0.78rem;
    flex-shrink:0;
  }

  /* ---------- Modal (examples & notation) ---------- */
  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(20,26,38,0.55);
    z-index:100;
    align-items:flex-start;
    justify-content:center;
    padding:5vh 18px;
    overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--paper-card);
    border-radius:14px;
    max-width:680px;
    width:100%;
    box-shadow:0 20px 60px rgba(15,20,30,0.35);
    overflow:hidden;
    margin-bottom:5vh;
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:20px 26px;
    background:var(--accent);
    color:#fff;
  }
  .modal-head .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.1em;
    text-transform:uppercase;
    font-size:0.68rem;
    opacity:0.85;
  }
  .modal-head h3{color:#fff; font-size:1.25rem; margin-top:2px;}
  .modal-close{
    background:rgba(255,255,255,0.15);
    border:none;
    color:#fff;
    width:32px; height:32px;
    border-radius:8px;
    font-size:1.1rem;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
  }
  .modal-close:hover{background:rgba(255,255,255,0.28);}
  .modal-body{
    padding:22px 26px 28px 26px;
    font-size:0.94rem;
    line-height:1.62;
    color:var(--ink-soft);
    max-height:70vh;
    overflow-y:auto;
  }
  .modal-body p{margin:0 0 12px 0;}
  .modal-body p:last-child{margin-bottom:0;}
  .modal-body strong{color:var(--ink);}
  .modal-body .ex-block{
    background:#f6f8fa;
    border:1px solid var(--line);
    border-left:4px solid var(--gold);
    border-radius:8px;
    padding:12px 16px;
    margin:12px 0;
  }
  .modal-body .ex-block .ex-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  .modal-body .notation-table{width:100%; border-collapse:collapse; margin:10px 0;}
  .modal-body .notation-table td{padding:5px 10px 5px 0; vertical-align:top; border-bottom:1px dashed var(--line);}
  .modal-body .notation-table td:first-child{font-family:'IBM Plex Mono',monospace; color:var(--ink); white-space:nowrap;}

  /* ---------- Solution reveal ---------- */
  .btn-solution{
    background:transparent;
    color:var(--ink-soft);
    border:1.5px dashed var(--line);
    padding:9px 16px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    border-radius:7px;
    cursor:pointer;
  }
  .btn-solution:hover{border-color:var(--accent); color:var(--accent-dark);}
  .solution-box{
    display:none;
    margin-top:14px;
    background:#f6f8fa;
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:8px;
    padding:14px 18px;
    font-size:0.9rem;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .solution-box.show{display:block;}
  .solution-box .sol-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  .solution-box p{margin:0 0 8px 0;}
  .solution-box p:last-child{margin-bottom:0;}
  .solution-box strong{color:var(--ink);}

  /* ---------- Chat UI styles ---------- */
  #tutor-chat {
    max-width: 800px;
    margin: 2rem auto;
    font-family: 'Inter', sans-serif;
  }
  
  #chat-output {
    min-height: 120px;
    max-height: 600px;
    overflow-y: auto;
    padding: 1.2rem 1.5rem;
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 0.75rem;
    background: var(--paper-card);
    color: var(--ink);
    font-size: 0.95rem;
    line-height: 1.7;
  }
  
  #chat-output h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--ink);
    margin: 0.8em 0 0.3em 0;
    font-family: 'Fraunces', serif;
  }
  
  #chat-output h2 {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--ink);
    margin: 0.8em 0 0.3em 0;
    font-family: 'Fraunces', serif;
  }
  
  #chat-output h3 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
    margin: 0.6em 0 0.2em 0;
    font-family: 'Fraunces', serif;
  }
  
  #chat-output p {
    margin: 0.4em 0;
    line-height: 1.7;
  }
  
  #chat-output ul, 
  #chat-output ol {
    margin: 0.5em 0;
    padding-left: 1.5em;
  }
  
  #chat-output li {
    margin: 0.3em 0;
    line-height: 1.6;
  }
  
  #chat-output ul ul,
  #chat-output ol ol {
    margin: 0.2em 0;
  }
  
  #chat-output blockquote {
    border-left: 4px solid var(--accent);
    padding: 0.5em 1em;
    margin: 0.8em 0;
    background: var(--paper);
    border-radius: 4px;
    color: var(--ink-soft);
    font-style: italic;
  }
  
  #chat-output hr {
    border: none;
    border-top: 2px solid var(--line);
    margin: 1.5em 0;
  }
  
  #chat-output code {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--paper);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  
  #chat-output pre {
    background: var(--paper);
    padding: 0.8em 1em;
    border-radius: 8px;
    overflow-x: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85em;
    border: 1px solid var(--line);
  }
  
  #chat-output table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.8em 0;
    font-size: 0.92rem;
  }
  
  #chat-output th,
  #chat-output td {
    border: 1px solid var(--line);
    padding: 0.5em 0.8em;
    text-align: left;
  }
  
  #chat-output th {
    background: var(--paper);
    font-weight: 600;
    color: var(--ink);
  }
  
  #chat-output tr:nth-child(even) {
    background: var(--paper);
  }
  
  #chat-output strong {
    font-weight: 600;
    color: var(--ink);
  }
  
  #chat-output em {
    font-style: italic;
  }
  
  #chat-output mjx-container {
  display: inline-block !important;
  margin: 0 0.1em !important;
}

#chat-output .MathJax {
  font-size: 1.05em !important;
}
  
  #tutor-chat .chat-input-row {
    display: flex;
    gap: 0.6rem;
  }
  
  #chat-input {
    flex: 1;
    padding: 0.6rem 1rem;
    border: 2px solid var(--line);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.3s ease;
  }
  
  #chat-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(31, 111, 120, 0.1);
  }
  
  #chat-send {
    padding: 0.6rem 1.8rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  
  #chat-send:hover {
    background: var(--accent-dark);
    transform: scale(1.02);
  }

  footer.appfoot{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.78rem;
    padding:20px;
  }

  @media (max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; border-right:none; border-bottom:1px solid var(--line); padding:20px;}
    nav.topics{flex-direction:row; flex-wrap:wrap;}
    .topic-btn{width:auto;}
    main{padding:22px 18px;}
    #tutor-chat{max-width:100%; margin:1.5rem auto;}
  }
</style>
</head>
<body>

<div id="passwordScreen">
  <div class="pw-card">
    <div class="eyebrow">STAT 353 &middot; Engineering Statistics</div>
    <h1>Problem Bank</h1>
    <p class="sub">Enter the class password to start a randomized practice set.</p>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
    <button class="btn btn-full" id="pwSubmit">Unlock</button>
    <div id="pwError"></div>
  </div>
</div>

<div id="app">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="eyebrow">STAT 353</div>
        <h1>Problem Bank</h1>
      </div>
      <nav class="topics" id="topicNav"></nav>
    </aside>
    <main>
      <div class="topic-header">
        <div class="eyebrow" id="topicEyebrow">Topic</div>
        <h2 id="topicTitle">&nbsp;</h2>
      </div>
      <div class="review-actions">
        <button class="btn-examples" id="examplesBtn"><span class="ico">i</span> Examples &amp; notation</button>
      </div>
      <div class="review-card" id="reviewBox"></div>
      <div class="problems-header">
        <h3>Practice problems</h3>
        <button class="btn btn-secondary btn-sm" id="regenBtn">New problem set &#8635;</button>
      </div>
      <div id="problemsBox"></div>

      <!-- ===== CHAT UI ===== -->
      <div id="tutor-chat">
        <div id="chat-output"></div>
        <div class="chat-input-row">
          <input id="chat-input" type="text" placeholder="Type your question..." />
          <button id="chat-send">Send</button>
        </div>
      </div>

    </main>
  </div>
  <footer class="appfoot">Feedback sent to the instructor: szhang@stcloudstate.edu</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <div class="eyebrow" id="modalEyebrow">Examples &amp; Notation</div>
        <h3 id="modalTitle">&nbsp;</h3>
      </div>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================================
   PASSWORD VERIFICATION
   ========================================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQCGg5etJ42203ORNfMFzj_F3t0DYf23TjFxohbWairzRxKkKQDQQ980Q42VxahrrH/exec";

async function verifyPassword(pwd){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
    return {ok:false, msg:"This page hasn't been connected to a password sheet yet. See the setup instructions."};
  }
  try{
    const res = await fetch(APPS_SCRIPT_URL + "?password=" + encodeURIComponent(pwd));
    const data = await res.json();
    if(data && data.valid){
      return {ok:true};
    }
    return {ok:false, msg:"Incorrect password. Please try again."};
  }catch(err){
    return {ok:false, msg:"Couldn't reach the password server. Check your internet connection and try again."};
  }
}

document.getElementById('pwSubmit').addEventListener('click', doVerify);
document.getElementById('pwInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doVerify(); });

async function doVerify(){
  const btn = document.getElementById('pwSubmit');
  const pwd = document.getElementById('pwInput').value;
  const errBox = document.getElementById('pwError');
  errBox.textContent = '';
  if(!pwd){ errBox.textContent = 'Please enter a password.'; return; }
  btn.disabled = true; btn.textContent = 'Checking\u2026';
  const result = await verifyPassword(pwd);
  btn.disabled = false; btn.textContent = 'Unlock';
  if(result.ok){
    document.getElementById('passwordScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    errBox.textContent = result.msg;
  }
}

/* =========================================================================
   PROBLEM GENERATORS
   ========================================================================= */
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rf(a,b,d=2){return +(Math.random()*(b-a)+a).toFixed(d);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function rnd(x,d=4){const m=Math.pow(10,d);return Math.round(x*m)/m;}
function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function nCr(n,r){return fact(n)/(fact(r)*fact(n-r));}
function nPr(n,r){return fact(n)/fact(n-r);}
function mean(arr){return arr.reduce((a,b)=>a+b,0)/arr.length;}
function sampleSD(arr){const m=mean(arr);return Math.sqrt(arr.reduce((a,b)=>a+(b-m)*(b-m),0)/(arr.length-1));}
function median(arr){const s=[...arr].sort((a,b)=>a-b);const n=s.length;return n%2? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2;}
function quartiles(arr){
  const s=[...arr].sort((a,b)=>a-b);
  const n=s.length;
  const mid=Math.floor(n/2);
  const lower = n%2===0 ? s.slice(0,mid) : s.slice(0,mid);
  const upper = n%2===0 ? s.slice(mid) : s.slice(mid+1);
  return {q1: median(lower), q3: median(upper)};
}
function defTol(a){ return Math.max(0.01, Math.abs(a)*0.01); }
function zForCL(cl){ return jStat.normal.inv(1-(1-cl)/2,0,1); }

function gen1(){
  const probs=[];
  let a=ri(2,5),b=ri(2,5),c=ri(2,4);
  probs.push({q:`A café menu offers ${a} soups, ${b} sandwiches, and ${c} side dishes. A lunch special consists of exactly one soup, one sandwich, and one side. How many different lunch specials are possible?`, a:a*b*c, tol:0.4,
    sol:`<p>This is a 3-step task: choose the soup, then the sandwich, then the side. By the <strong>multiplicative counting principle</strong>, multiply the number of choices at each step.</p>
<p>\\( ${a} \\text{ soups} \\times ${b} \\text{ sandwiches} \\times ${c} \\text{ sides} = ${a*b*c} \\) lunch specials.</p>`});
  let n=ri(4,7);
  probs.push({q:`In how many different ways can ${n} distinct textbooks be arranged in a row on a shelf?`, a:fact(n), tol:0.4,
    sol:`<p>Arranging all \\(n\\) distinct items in a row is a <strong>permutation of all n items</strong>, which equals \\(n!\\).</p>
<p>With \\(n=${n}\\): \\(${n}! = ${Array.from({length:n},(_,i)=>n-i).join(' \\times ')} = ${fact(n)}\\).</p>`});
  let n2=ri(6,10);
  probs.push({q:`A club with ${n2} members must elect a president, a secretary, and a treasurer. No member can hold more than one office. In how many ways can these three offices be filled?`, a:nPr(n2,3), tol:0.4,
    sol:`<p>The three offices are distinguishable (order matters: president \\(\\ne\\) secretary \\(\\ne\\) treasurer), and no repeats are allowed, so this is a <strong>permutation</strong> of 3 members chosen from ${n2}.</p>
<p>\\( P(${n2},3) = \\dfrac{${n2}!}{(${n2}-3)!} = ${n2} \\times ${n2-1} \\times ${n2-2} = ${nPr(n2,3)} \\).</p>
<p>(Think of it step by step: ${n2} choices for president, then ${n2-1} remaining choices for secretary, then ${n2-2} remaining choices for treasurer.)</p>`});
  let L=ri(2,3), D=ri(2,3);
  probs.push({q:`A license plate consists of ${L} letters (A\u2013Z) followed by ${D} digits (0\u20139), with repetition allowed. How many different license plates are possible?`, a: Math.pow(26,L)*Math.pow(10,D), tol:0.4,
    sol:`<p>Since repetition is allowed, each of the ${L} letter slots has 26 possible values, and each of the ${D} digit slots has 10 possible values. Multiply all slot counts together (multiplicative counting principle).</p>
<p>\\( 26^{${L}} \\times 10^{${D}} = ${Math.pow(26,L)} \\times ${Math.pow(10,D)} = ${Math.pow(26,L)*Math.pow(10,D)} \\) possible plates.</p>`});
  let k=ri(4,7), j=ri(1,k-1);
  probs.push({q:`A fair coin is tossed ${k} times. How many outcomes in the sample space contain exactly ${j} heads?`, a: nCr(k,j), tol:0.4,
    sol:`<p>Each outcome is a sequence of ${k} H's/T's. We need to choose <em>which</em> ${j} of the ${k} tosses are heads \u2014 order among the chosen positions doesn't matter, so this is a <strong>combination</strong>.</p>
<p>\\( \\binom{${k}}{${j}} = \\dfrac{${k}!}{${j}!\\,(${k}-${j})!} = ${nCr(k,j)} \\) outcomes have exactly ${j} heads.</p>`});
  return probs;
}

function gen2(){
  const probs=[];
  let rank = pick(['King','Queen','Ace','7']);
  probs.push({q:`A single card is drawn at random from a standard 52-card deck. What is the probability that it is a ${rank}? (There are 4 of each rank.)`, a: rnd(4/52,4), tol:0.001,
    sol:`<p>All 52 cards are equally likely outcomes, and 4 of them are a ${rank}. So \\(P(${rank}) = \\dfrac{\\#\\text{ outcomes in event}}{\\#\\text{ outcomes in }S} = \\dfrac{4}{52} = ${rnd(4/52,4)}\\).</p>`});
  let s = ri(3,11);
  let count=0;
  let pairs=[];
  for(let i=1;i<=6;i++) for(let j2=1;j2<=6;j2++) if(i+j2===s){ count++; pairs.push(`(${i},${j2})`); }
  probs.push({q:`Two fair six-sided dice are rolled. What is the probability that the sum of the two dice equals ${s}?`, a: rnd(count/36,4), tol:0.001,
    sol:`<p>The sample space has \\(6\\times6=36\\) equally likely (die 1, die 2) outcomes. The outcomes that sum to ${s} are: ${pairs.join(', ')} \u2014 that's ${count} outcome(s).</p>
<p>\\(P(\\text{sum}=${s}) = \\dfrac{${count}}{36} = ${rnd(count/36,4)}\\).</p>`});
  let pA=rf(0.2,0.5,2), pB=rf(0.15,0.4,2);
  let capMin=Math.min(pA,pB);
  let pAB=rf(0.02, Math.max(0.03,capMin*0.6),2);
  probs.push({q:`For two events A and B, \\(P(A) = ${pA}\\), \\(P(B) = ${pB}\\), and \\(P(A \\cap B) = ${pAB}\\). Find \\(P(A \\cup B)\\).`, a: rnd(pA+pB-pAB,4), tol:0.005,
    sol:`<p>Use the general addition rule (works whether or not A and B overlap): \\(P(A\\cup B) = P(A)+P(B)-P(A\\cap B)\\). We subtract \\(P(A\\cap B)\\) once because it was counted in <em>both</em> \\(P(A)\\) and \\(P(B)\\).</p>
<p>\\(P(A\\cup B) = ${pA} + ${pB} - ${pAB} = ${rnd(pA+pB-pAB,4)}\\).</p>`});
  let pA2=rf(0.1,0.8,2);
  probs.push({q:`If \\(P(A) = ${pA2}\\), what is \\(P(A')\\), the probability of the complement of A?`, a: rnd(1-pA2,4), tol:0.005,
    sol:`<p>Since \\(A\\) and \\(A'\\) together make up the entire sample space and cannot both occur, \\(P(A)+P(A')=1\\).</p>
<p>\\(P(A') = 1-P(A) = 1-${pA2} = ${rnd(1-pA2,4)}\\).</p>`});
  let counts=[ri(10,20),ri(10,20),ri(10,20)];
  let total=counts.reduce((x,y)=>x+y,0);
  let idx=ri(0,2);
  let labels=['Category 1','Category 2','Category 3'];
  probs.push({q:`A survey of ${total} people classified each person into one of three categories: ${counts[0]} in Category 1, ${counts[1]} in Category 2, and ${counts[2]} in Category 3. If one person is selected at random, what is the probability that the person is in ${labels[idx]}?`, a: rnd(counts[idx]/total,4), tol:0.005,
    sol:`<p>Since each of the ${total} people is equally likely to be selected, the probability of choosing someone from ${labels[idx]} is just that category's count divided by the total.</p>
<p>\\(P(${labels[idx]}) = \\dfrac{${counts[idx]}}{${total}} = ${rnd(counts[idx]/total,4)}\\).</p>`});
  return probs;
}

function gen3(){
  const probs=[];
  let pA=rf(0.15,0.4,2), pB=rf(0.15,0.4,2);
  probs.push({q:`Events A and B are disjoint (mutually exclusive), with \\(P(A) = ${pA}\\) and \\(P(B) = ${pB}\\). Find \\(P(A \\cup B)\\).`, a: rnd(pA+pB,4), tol:0.005,
    sol:`<p>Because A and B are disjoint, they cannot both happen, so \\(P(A\\cap B)=0\\) and the general addition rule simplifies to \\(P(A\\cup B)=P(A)+P(B)\\).</p>
<p>\\(P(A\\cup B) = ${pA} + ${pB} = ${rnd(pA+pB,4)}\\).</p>`});
  let pA2=rf(0.2,0.6,2), pB2=rf(0.2,0.6,2);
  probs.push({q:`Events A and B are independent, with \\(P(A) = ${pA2}\\) and \\(P(B) = ${pB2}\\). Find \\(P(A \\cap B)\\).`, a: rnd(pA2*pB2,4), tol:0.005,
    sol:`<p>For independent events, the multiplication rule gives \\(P(A\\cap B) = P(A)\\cdot P(B)\\).</p>
<p>\\(P(A\\cap B) = ${pA2} \\times ${pB2} = ${rnd(pA2*pB2,4)}\\).</p>`});
  let pA3=rf(0.3,0.7,2), pB3=rf(0.2,0.6,2);
  probs.push({q:`Events A and B are independent, with \\(P(A) = ${pA3}\\) and \\(P(B) = ${pB3}\\). Find the probability that neither A nor B occurs.`, a: rnd((1-pA3)*(1-pB3),4), tol:0.005,
    sol:`<p>"Neither occurs" means \\(A'\\) and \\(B'\\) both happen. If \\(A,B\\) are independent, then \\(A',B'\\) are independent too, so multiply their complement probabilities.</p>
<p>\\(P(A')=1-${pA3}=${rnd(1-pA3,4)}\\), \\(P(B')=1-${pB3}=${rnd(1-pB3,4)}\\).</p>
<p>\\(P(\\text{neither}) = P(A')P(B') = ${rnd(1-pA3,4)} \\times ${rnd(1-pB3,4)} = ${rnd((1-pA3)*(1-pB3),4)}\\).</p>`});
  let pA4=rf(0.2,0.5,2), pB4=rf(0.2,0.5,2);
  probs.push({q:`Events A and B are independent, with \\(P(A) = ${pA4}\\) and \\(P(B) = ${pB4}\\). Find \\(P(A \\cup B)\\).`, a: rnd(pA4+pB4-pA4*pB4,4), tol:0.005,
    sol:`<p>First use independence to get \\(P(A\\cap B)=P(A)P(B) = ${pA4}\\times${pB4} = ${rnd(pA4*pB4,4)}\\). Then apply the general addition rule.</p>
<p>\\(P(A\\cup B) = P(A)+P(B)-P(A\\cap B) = ${pA4}+${pB4}-${rnd(pA4*pB4,4)} = ${rnd(pA4+pB4-pA4*pB4,4)}\\).</p>`});
  let pA5=rf(0.1,0.3,2), pB5=rf(0.1,0.3,2), pC5=rf(0.1,0.2,2);
  let pD = rnd(1-pA5-pB5-pC5,4);
  probs.push({q:`Events A, B, C, and D form a partition of the sample space (they are disjoint and cover all outcomes). If \\(P(A) = ${pA5}\\), \\(P(B) = ${pB5}\\), and \\(P(C) = ${pC5}\\), find \\(P(D)\\).`, a: pD, tol:0.005,
    sol:`<p>Since A, B, C, D partition the sample space, their probabilities must sum to 1 (they are disjoint and cover every outcome).</p>
<p>\\(P(D) = 1-P(A)-P(B)-P(C) = 1-${pA5}-${pB5}-${pC5} = ${pD}\\).</p>`});
  return probs;
}

function gen4(){
  const probs=[];
  function machineScenario(){
    let w1=ri(25,40), w2=ri(25,40), w3=100-w1-w2;
    if(w3<15){w3=20;w1=40;w2=40;}
    let d1=rf(0.01,0.04,3), d2=rf(0.02,0.05,3), d3=rf(0.03,0.07,3);
    let pD = (w1*d1+w2*d2+w3*d3)/100;
    return {w1,w2,w3,d1,d2,d3,pD};
  }
  let s1=machineScenario();
  probs.push({q:`A factory has three machines producing ${s1.w1}%, ${s1.w2}%, and ${s1.w3}% of its daily output, respectively. Their defect rates are ${rnd(s1.d1*100,1)}%, ${rnd(s1.d2*100,1)}%, and ${rnd(s1.d3*100,1)}% respectively. Using the total probability formula, find the overall probability that a randomly selected item is defective.`, a: rnd(s1.pD,4), tol:0.001,
    sol:`<p>The three machines partition all output. Weight each machine's defect rate by the fraction of output it produces, then add: \\(P(D) = \\sum_i P(M_i)P(D\\mid M_i)\\).</p>
<p>\\(P(D) = (${s1.w1/100})(${s1.d1}) + (${s1.w2/100})(${s1.d2}) + (${s1.w3/100})(${s1.d3})\\)</p>
<p>\\(= ${rnd(s1.w1/100*s1.d1,5)} + ${rnd(s1.w2/100*s1.d2,5)} + ${rnd(s1.w3/100*s1.d3,5)} = ${rnd(s1.pD,4)}\\).</p>`});

  let s2=machineScenario();
  let pM1D = (s2.w1/100*s2.d1)/s2.pD;
  probs.push({q:`A factory has three machines producing ${s2.w1}%, ${s2.w2}%, and ${s2.w3}% of its daily output, respectively, with defect rates ${rnd(s2.d1*100,1)}%, ${rnd(s2.d2*100,1)}%, and ${rnd(s2.d3*100,1)}%. Given that a randomly selected item is defective, use Bayes' formula to find the probability that it came from Machine 1.`, a: rnd(pM1D,4), tol:0.005,
    sol:`<p><strong>Step 1 \u2014 total probability (denominator):</strong> \\(P(D) = (${s2.w1/100})(${s2.d1})+(${s2.w2/100})(${s2.d2})+(${s2.w3/100})(${s2.d3}) = ${rnd(s2.pD,5)}\\).</p>
<p><strong>Step 2 \u2014 Bayes' formula (numerator uses only Machine 1):</strong> \\(P(M_1\\mid D) = \\dfrac{P(M_1)P(D\\mid M_1)}{P(D)} = \\dfrac{(${s2.w1/100})(${s2.d1})}{${rnd(s2.pD,5)}} = \\dfrac{${rnd(s2.w1/100*s2.d1,5)}}{${rnd(s2.pD,5)}} \\approx ${rnd(pM1D,4)}\\).</p>`});

  let prev = rf(0.01,0.08,3);
  let sens = rf(0.9,0.99,3);
  let spec = rf(0.9,0.99,3);
  let pPos = prev*sens + (1-prev)*(1-spec);
  probs.push({q:`A disease affects ${(prev*100).toFixed(1)}% of a population. A diagnostic test correctly identifies a diseased person as positive ${(sens*100).toFixed(1)}% of the time (sensitivity) and correctly identifies a healthy person as negative ${(spec*100).toFixed(1)}% of the time (specificity). Use the total probability formula to find the probability that a randomly selected person tests positive.`, a: rnd(pPos,4), tol:0.001,
    sol:`<p>A positive test can happen two ways: a diseased person tests positive (true positive), or a healthy person tests positive (false positive). Partition on disease status: \\(D\\) = disease, \\(D'\\) = no disease.</p>
<p>\\(P(\\text{Diseased}) = ${prev}\\), \\(P(+\\mid \\text{Diseased}) = ${sens}\\) (sensitivity). \\(P(\\text{Healthy}) = 1-${prev} = ${rnd(1-prev,3)}\\), \\(P(+\\mid \\text{Healthy}) = 1-${spec} = ${rnd(1-spec,3)}\\) (1 \u2212 specificity, since a healthy person tests positive only when the test is wrong).</p>
<p>\\(P(+) = (${prev})(${sens}) + (${rnd(1-prev,3)})(${rnd(1-spec,3)}) = ${rnd(prev*sens,5)} + ${rnd((1-prev)*(1-spec),5)} = ${rnd(pPos,4)}\\).</p>`});

  let prev2 = rf(0.01,0.08,3);
  let sens2 = rf(0.9,0.99,3);
  let spec2 = rf(0.9,0.99,3);
  let pPos2 = prev2*sens2 + (1-prev2)*(1-spec2);
  let pDisPos = (prev2*sens2)/pPos2;
  probs.push({q:`A disease affects ${(prev2*100).toFixed(1)}% of a population. A diagnostic test has sensitivity ${(sens2*100).toFixed(1)}% and specificity ${(spec2*100).toFixed(1)}%. Given that a randomly selected person tests positive, use Bayes' formula to find the probability that the person actually has the disease.`, a: rnd(pDisPos,4), tol:0.005,
    sol:`<p><strong>Step 1 \u2014 total probability of testing positive:</strong> \\(P(+) = (${prev2})(${sens2}) + (1-${prev2})(1-${spec2}) = ${rnd(prev2*sens2,5)} + ${rnd((1-prev2)*(1-spec2),5)} = ${rnd(pPos2,5)}\\).</p>
<p><strong>Step 2 \u2014 Bayes' formula:</strong> \\(P(\\text{Diseased}\\mid +) = \\dfrac{P(\\text{Diseased})P(+\\mid\\text{Diseased})}{P(+)} = \\dfrac{${rnd(prev2*sens2,5)}}{${rnd(pPos2,5)}} \\approx ${rnd(pDisPos,4)}\\).</p>
<p>Notice this is much smaller than the sensitivity itself \u2014 with a low disease prevalence, most positive tests are still false positives, which is the classic lesson of this type of problem.</p>`});

  let boxes = [ri(30,50), ri(30,50)];
  let redFrac = [rf(0.2,0.4,2), rf(0.5,0.7,2)];

    sol:`<p><strong>Step 1 \u2014 total probability of drawing red:</strong> \\(P(\\text{Red}) = P(\\text{Box 1})P(\\text{Red}\\mid\\text{Box 1}) + P(\\text{Box 2})P(\\text{Red}\\mid\\text{Box 2}) = (0.5)(${redFrac[0]}) + (0.5)(${redFrac[1]}) = ${rnd(0.5*redFrac[0],4)} + ${rnd(0.5*redFrac[1],4)} = ${rnd(pRedTotal,4)}\\).</p>
<p><strong>Step 2 \u2014 Bayes' formula for Box ${boxChoice+1}:</strong> \\(P(\\text{Box ${boxChoice+1}}\\mid\\text{Red}) = \\dfrac{(0.5)(${redFrac[boxChoice]})}{${rnd(pRedTotal,4)}} = \\dfrac{${rnd(0.5*redFrac[boxChoice],4)}}{${rnd(pRedTotal,4)}} \\approx ${rnd(pBoxGivenRed,4)}\\).</p>`});
  return probs;
}

// ===== Topic 5 =====
function gen5(){
  const probs=[];
  let xs=[0,1,2,3];
  let raw=[ri(1,4),ri(1,4),ri(1,4),ri(1,4)];
  let tot=raw.reduce((a,b)=>a+b,0);
  let ps=raw.map(r=>rnd(r/tot,4));
  let sum3=ps[0]+ps[1]+ps[2];
  ps[3]=rnd(1-sum3,4);
  let EX = xs.reduce((s,x,i)=>s+x*ps[i],0);
  probs.push({q:`A discrete random variable X has the following PMF: \\(P(X{=}0){=}${ps[0]}\\), \\(P(X{=}1){=}${ps[1]}\\), \\(P(X{=}2){=}${ps[2]}\\), \\(P(X{=}3){=}${ps[3]}\\). Find \\(E(X)\\), the mean of X.`, a: rnd(EX,4), tol:0.01,
    sol:`<p>The mean of a discrete RV is \\(E(X) = \\sum x\\,p(x)\\): multiply each value by its probability and add.</p>
<p>\\(E(X) = 0(${ps[0]}) + 1(${ps[1]}) + 2(${ps[2]}) + 3(${ps[3]}) = ${rnd(0*ps[0],4)} + ${rnd(1*ps[1],4)} + ${rnd(2*ps[2],4)} + ${rnd(3*ps[3],4)} = ${rnd(EX,4)}\\).</p>`});

  let a2=ri(2,5), b2=ri(1,4);
  let EgX = a2*EX+b2;
  probs.push({q:`Using the same PMF (\\(P(X{=}0){=}${ps[0]}\\), \\(P(X{=}1){=}${ps[1]}\\), \\(P(X{=}2){=}${ps[2]}\\), \\(P(X{=}3){=}${ps[3]}\\)), find \\(E(${a2}X + ${b2})\\).`, a: rnd(EgX,4), tol:0.01,
    sol:`<p>For a linear function of X, use \\(E(aX+b) = aE(X)+b\\) rather than rebuilding a whole new PMF.</p>
<p>From the previous problem, \\(E(X) = ${rnd(EX,4)}\\). So \\(E(${a2}X+${b2}) = ${a2}(${rnd(EX,4)}) + ${b2} = ${rnd(a2*EX,4)} + ${b2} = ${rnd(EgX,4)}\\).</p>`});

  let n=ri(6,12), p=rf(0.2,0.6,2), k=ri(1,n-1);
  let pBin = nCr(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k);
  probs.push({q:`X follows a \\(\\text{Binomial}(n{=}${n}, p{=}${p})\\) distribution. Find \\(P(X = ${k})\\).`, a: rnd(pBin,4), tol:0.001,
    sol:`<p>The Binomial PMF is \\(P(X{=}k) = \\binom{n}{k}p^k(1-p)^{n-k}\\), where \\(\\binom{n}{k}\\) counts the number of ways to choose which \\(k\\) of the \\(n\\) trials are successes.</p>
<p>\\(\\binom{${n}}{${k}} = ${nCr(n,k)}\\). \\(p^{${k}} = ${p}^{${k}} = ${rnd(Math.pow(p,k),6)}\\). \\((1-p)^{${n-k}} = ${rnd(1-p,2)}^{${n-k}} = ${rnd(Math.pow(1-p,n-k),6)}\\).</p>
<p>\\(P(X={${k}}) = ${nCr(n,k)} \\times ${rnd(Math.pow(p,k),6)} \\times ${rnd(Math.pow(1-p,n-k),6)} \\approx ${rnd(pBin,4)}\\).</p>`});

  let pg=rf(0.15,0.5,2), kg=ri(2,6);
  let pGeo = Math.pow(1-pg,kg-1)*pg;
  probs.push({q:`The probability of success on each independent trial is \\(p = ${pg}\\). Let X be the trial number of the first success (geometric distribution). Find \\(P(X = ${kg})\\).`, a: rnd(pGeo,4), tol:0.001,
    sol:`<p>The Geometric PMF is \\(P(X{=}k) = (1-p)^{k-1}p\\): the first \\(k-1\\) trials must all be failures, then trial \\(k\\) is the first success.</p>
<p>\\(P(X={${kg}}) = (1-${pg})^{${kg}-1}(${pg}) = (${rnd(1-pg,2)})^{${kg-1}}(${pg}) = ${rnd(Math.pow(1-pg,kg-1),6)} \\times ${pg} \\approx ${rnd(pGeo,4)}\\).</p>`});

  let lam=ri(2,8), kp=ri(0,lam+3);
  let pPois = Math.exp(-lam)*Math.pow(lam,kp)/fact(kp);
  probs.push({q:`The number of arrivals per hour at a service desk follows a Poisson distribution with mean \\(\\lambda = ${lam}\\). Find \\(P(X = ${kp})\\) arrivals in an hour.`, a: rnd(pPois,4), tol:0.001,
    sol:`<p>The Poisson PMF is \\(P(X{=}k) = \\dfrac{e^{-\\lambda}\\lambda^k}{k!}\\).</p>
<p>\\(P(X={${kp}}) = \\dfrac{e^{-${lam}}(${lam})^{${kp}}}{${kp}!} = \\dfrac{${rnd(Math.exp(-lam),6)} \\times ${rnd(Math.pow(lam,kp),4)}}{${fact(kp)}} \\approx ${rnd(pPois,4)}\\).</p>`});
  return probs;
}

function gen7(){
  const probs=[];
  function buildTable(){
    let raw=[ri(1,5),ri(1,5),ri(1,5),ri(1,5)];
    let tot=raw.reduce((a,b)=>a+b,0);
    let p=raw.map(r=>rnd(r/tot,3));
    let s3=p[0]+p[1]+p[2];
    p[3]=rnd(1-s3,3);
    return p;
  }
  let p=buildTable();
  const tableTxt = `Joint PMF table: \\(P(X{=}0,Y{=}0){=}${p[0]}\\), \\(P(X{=}0,Y{=}1){=}${p[1]}\\), \\(P(X{=}1,Y{=}0){=}${p[2]}\\), \\(P(X{=}1,Y{=}1){=}${p[3]}\\).`;
  let pX0=p[0]+p[1], pX1=p[2]+p[3];
  let pY0=p[0]+p[2], pY1=p[1]+p[3];
  let EX=0*pX0+1*pX1, EY=0*pY0+1*pY1;
  let EXY = 0*0*p[0]+0*1*p[1]+1*0*p[2]+1*1*p[3];
  let cov = EXY-EX*EY;
  let EX2 = 0*0*pX0+1*1*pX1, EY2=0*0*pY0+1*1*pY1;
  let varX=EX2-EX*EX, varY=EY2-EY*EY;
  let corr = cov/Math.sqrt(varX*varY);

  probs.push({q:`${tableTxt} Find the marginal probability \\(P(X=1)\\).`, a: rnd(pX1,4), tol:0.005,
    sol:`<p>The marginal \\(P(X{=}1)\\) sums the joint probabilities over every value of Y where \\(X{=}1\\): the cells \\((1,0)\\) and \\((1,1)\\).</p>
<p>\\(P(X{=}1) = P(X{=}1,Y{=}0) + P(X{=}1,Y{=}1) = ${p[2]} + ${p[3]} = ${rnd(pX1,4)}\\).</p>`});
  let p2=buildTable();
  const t2 = `Joint PMF table: \\(P(X{=}0,Y{=}0){=}${p2[0]}\\), \\(P(X{=}0,Y{=}1){=}${p2[1]}\\), \\(P(X{=}1,Y{=}0){=}${p2[2]}\\), \\(P(X{=}1,Y{=}1){=}${p2[3]}\\).`;
  let pX1_2 = p2[2]+p2[3];
  let EX_2 = 0*(p2[0]+p2[1])+1*pX1_2;
  probs.push({q:`${t2} Find \\(E(X)\\).`, a: rnd(EX_2,4), tol:0.01,
    sol:`<p><strong>Step 1 \u2014 find the marginal of X:</strong> \\(P(X{=}0) = ${p2[0]}+${p2[1]} = ${rnd(p2[0]+p2[1],4)}\\); \\(P(X{=}1) = ${p2[2]}+${p2[3]} = ${rnd(pX1_2,4)}\\).</p>
<p><strong>Step 2 \u2014 apply \\(E(X)=\\sum x\\,p(x)\\):</strong> \\(E(X) = 0(${rnd(p2[0]+p2[1],4)}) + 1(${rnd(pX1_2,4)}) = ${rnd(EX_2,4)}\\).</p>`});

  let p3=buildTable();
  const t3 = `Joint PMF table: \\(P(X{=}0,Y{=}0){=}${p3[0]}\\), \\(P(X{=}0,Y{=}1){=}${p3[1]}\\), \\(P(X{=}1,Y{=}0){=}${p3[2]}\\), \\(P(X{=}1,Y{=}1){=}${p3[3]}\\).`;
  let EXY_3 = p3[3];
  probs.push({q:`${t3} Find \\(E(XY)\\).`, a: rnd(EXY_3,4), tol:0.01,
    sol:`<p>\\(E(XY) = \\sum_x\\sum_y xy\\,p(x,y)\\). Since \\(X\\) or \\(Y\\) equal to 0 makes the \\(xy\\) product 0, only the \\((1,1)\\) cell contributes.</p>
<p>\\(E(XY) = (0)(0)p(0,0) + (0)(1)p(0,1) + (1)(0)p(1,0) + (1)(1)p(1,1) = ${p3[3]}\\).</p>`});

  probs.push({q:`${tableTxt} Find \\(\\operatorname{Cov}(X, Y) = E(XY) - E(X)E(Y)\\).`, a: rnd(cov,4), tol:0.01,
    sol:`<p><strong>Step 1 \u2014 marginals:</strong> \\(P(X{=}1) = ${p[2]}+${p[3]} = ${rnd(pX1,4)}\\); \\(P(Y{=}1) = ${p[1]}+${p[3]} = ${rnd(pY1,4)}\\). So \\(E(X)=${rnd(EX,4)}\\), \\(E(Y)=${rnd(EY,4)}\\).</p>
<p><strong>Step 2 \u2014 \\(E(XY)\\):</strong> only the \\((1,1)\\) cell contributes since otherwise \\(xy=0\\): \\(E(XY) = p(1,1) = ${p[3]}\\).</p>
<p><strong>Step 3 \u2014 covariance:</strong> \\(\\operatorname{Cov}(X,Y) = E(XY)-E(X)E(Y) = ${p[3]} - (${rnd(EX,4)})(${rnd(EY,4)}) = ${p[3]} - ${rnd(EX*EY,4)} = ${rnd(cov,4)}\\).</p>`});
  probs.push({q:`${tableTxt} Find the correlation coefficient \\(\\rho\\) between X and Y (using \\(\\operatorname{Cov}(X,Y)\\) and the standard deviations of X and Y).`, a: rnd(corr,4), tol:0.02,
    sol:`<p><strong>Step 1 \u2014 covariance</strong> (as above): \\(\\operatorname{Cov}(X,Y) = ${rnd(cov,4)}\\).</p>
<p><strong>Step 2 \u2014 variances:</strong> \\(\\operatorname{Var}(X) = E(X^2)-[E(X)]^2\\). Since \\(X\\) only takes values 0/1, \\(E(X^2)=E(X)\\), so \\(\\operatorname{Var}(X) = ${rnd(EX,4)}-${rnd(EX,4)}^2 = ${rnd(varX,4)}\\). Similarly \\(\\operatorname{Var}(Y) = ${rnd(EY,4)}-${rnd(EY,4)}^2 = ${rnd(varY,4)}\\).</p>
<p><strong>Step 3 \u2014 correlation:</strong> \\(\\rho = \\dfrac{\\operatorname{Cov}(X,Y)}{\\sqrt{\\operatorname{Var}(X)\\operatorname{Var}(Y)}} = \\dfrac{${rnd(cov,4)}}{\\sqrt{${rnd(varX,4)}\\times${rnd(varY,4)}}} \\approx ${rnd(corr,4)}\\).</p>`});
  return probs;
}

<p>\\(\\bar{x} = \\dfrac{${d1.join('+')}}{${d1.length}} = \\dfrac{${d1.reduce((a,b)=>a+b,0)}}{${d1.length}} = ${rnd(mean(d1),4)}\\).</p>`});

<p><strong>Step 2 \u2014 squared deviations \\((x_i-\\bar{x})^2\\):</strong> ${sq3.join(', ')}; sum \\(=${rnd(ss3,3)}\\).</p>
<p><strong>Step 3 \u2014 divide by \\(n-1=${d3.length-1}\\) and take the square root:</strong> \\(s = \\sqrt{\\dfrac{${rnd(ss3,3)}}{${d3.length-1}}} = \\sqrt{${rnd(ss3/(d3.length-1),4)}} \\approx ${rnd(sampleSD(d3),4)}\\).</p>`});

    sol:`<p><strong>Step 1 \u2014 sort the data:</strong> {${sorted4.join(', ')}}.</p>
<p><strong>Step 2 \u2014 take the lower half</strong> (values below the overall median): {${lower4.join(', ')}}.</p>
<p><strong>Step 3 \u2014 \\(Q_1\\) is the median of that lower half:</strong> \\(Q_1 = ${rnd(qs.q1,4)}\\).</p>`});

  let d5=dataset(7,9);

  let n4=ri(120,300); let p0=rf(0.3,0.55,2); let x4=ri(Math.round(n4*(p0-0.08)),Math.round(n4*(p0+0.08)));

<p>\\(\\hat{p}_1 = ${s1.x}/${s1.n} = ${rnd(s1.p,4)}\\); \\(\\hat{p}_2 = ${s2.x}/${s2.n} = ${rnd(s2.p,4)}\\).</p>

  let s3=samp(), s4=samp(), cl=pick([0.90,0.95,0.99]);
  let SE34 = Math.sqrt(s3.p*(1-s3.p)/s3.n + s4.p*(1-s4.p)/s4.n);
  probs.push({q:`Sample 1: \\(n_1 = ${s3.n}\\), \\(x_1 = ${s3.x}\\). Sample 2: \\(n_2 = ${s4.n}\\), \\(x_2 = ${s4.x}\\). Find the standard error of \\(\\hat{p}_1 - \\hat{p}_2\\) used for a ${cl*100}% confidence interval: \\(SE = \\sqrt{\\dfrac{\\hat{p}_1(1-\\hat{p}_1)}{n_1} + \\dfrac{\\hat{p}_2(1-\\hat{p}_2)}{n_2}}\\).`, a: rnd(SE34,4), tol:0.003,
    sol:`<p>\\(\\hat{p}_1 = ${s3.x}/${s3.n} = ${rnd(s3.p,4)}\\); \\(\\hat{p}_2 = ${s4.x}/${s4.n} = ${rnd(s4.p,4)}\\). This is a <em>confidence-interval</em> SE, so each sample's own proportion is used (unpooled).</p>
<p>\\(SE = \\sqrt{\\dfrac{${rnd(s3.p,4)}(${rnd(1-s3.p,4)})}{${s3.n}} + \\dfrac{${rnd(s4.p,4)}(${rnd(1-s4.p,4)})}{${s4.n}}} = \\sqrt{${rnd(s3.p*(1-s3.p)/s3.n,6)} + ${rnd(s4.p*(1-s4.p)/s4.n,6)}} \\approx ${rnd(SE34,4)}\\).</p>`});

  let s5=samp(), s6=samp(), cl2=pick([0.90,0.95,0.99]);
  let SE56 = Math.sqrt(s5.p*(1-s5.p)/s5.n + s6.p*(1-s6.p)/s6.n);
  let z56 = zForCL(cl2);
  let upper56 = (s5.p-s6.p) + z56*SE56;
  probs.push({q:`Sample 1: \\(n_1 = ${s5.n}\\), \\(x_1 = ${s5.x}\\). Sample 2: \\(n_2 = ${s6.n}\\), \\(x_2 = ${s6.x}\\). Find the upper bound of the ${cl2*100}% confidence interval for \\(p_1 - p_2\\).`, a: rnd(upper56,4), tol:0.004,
    sol:`<p><strong>Step 1:</strong> \\(\\hat{p}_1=${rnd(s5.p,4)}\\), \\(\\hat{p}_2=${rnd(s6.p,4)}\\), so the point estimate is \\(${rnd(s5.p-s6.p,4)}\\).</p>
<p><strong>Step 2 \u2014 unpooled SE:</strong> \\(SE = \\sqrt{\\dfrac{${rnd(s5.p,4)}(${rnd(1-s5.p,4)})}{${s5.n}}+\\dfrac{${rnd(s6.p,4)}(${rnd(1-s6.p,4)})}{${s6.n}}} \\approx ${rnd(SE56,4)}\\).</p>
<p><strong>Step 3:</strong> with \\(z\\approx${rnd(z56,3)}\\) for ${cl2*100}% confidence, the upper bound is \\((\\hat{p}_1-\\hat{p}_2)+zSE = ${rnd(s5.p-s6.p,4)} + ${rnd(z56,3)}(${rnd(SE56,4)}) \\approx ${rnd(upper56,4)}\\).</p>`});

  let s7=samp(), s8=samp();
  let pPool78 = (s7.x+s8.x)/(s7.n+s8.n);
  probs.push({q:`Sample 1: \\(n_1 = ${s7.n}\\), \\(x_1 = ${s7.x}\\). Sample 2: \\(n_2 = ${s8.n}\\), \\(x_2 = ${s8.x}\\). For a test of \\(H_0: p_1 = p_2\\), find the pooled proportion \\(\\hat{p} = \\dfrac{x_1+x_2}{n_1+n_2}\\).`, a: rnd(pPool78,4), tol:0.003,
    sol:`<p>Under \\(H_0:p_1=p_2\\), both samples are assumed to come from the same population proportion, so we pool the counts and sample sizes together.</p>
<p>\\(\\hat{p} = \\dfrac{x_1+x_2}{n_1+n_2} = \\dfrac{${s7.x}+${s8.x}}{${s7.n}+${s8.n}} = \\dfrac{${s7.x+s8.x}}{${s7.n+s8.n}} = ${rnd(pPool78,4)}\\).</p>`});

  let s9=samp(), s10=samp();
  let pPool910 = (s9.x+s10.x)/(s9.n+s10.n);
  let SEpool = Math.sqrt(pPool910*(1-pPool910)*(1/s9.n+1/s10.n));
  let z910 = (s9.p-s10.p)/SEpool;
  probs.push({q:`Sample 1: \\(n_1 = ${s9.n}\\), \\(x_1 = ${s9.x}\\). Sample 2: \\(n_2 = ${s10.n}\\), \\(x_2 = ${s10.x}\\). For a test of \\(H_0: p_1 = p_2\\) vs \\(H_1: p_1 \\ne p_2\\), find the test statistic z using the pooled proportion.`, a: rnd(z910,4), tol:0.03,
    sol:`<p><strong>Step 1 \u2014 pooled proportion:</strong> \\(\\hat{p} = \\dfrac{${s9.x}+${s10.x}}{${s9.n}+${s10.n}} = ${rnd(pPool910,4)}\\).</p>
<p><strong>Step 2 \u2014 pooled SE:</strong> \\(SE_{pool} = \\sqrt{\\hat p(1-\\hat p)\\left(\\dfrac{1}{n_1}+\\dfrac{1}{n_2}\\right)} = \\sqrt{${rnd(pPool910,4)}(${rnd(1-pPool910,4)})\\left(\\dfrac{1}{${s9.n}}+\\dfrac{1}{${s10.n}}\\right)} \\approx ${rnd(SEpool,4)}\\).</p>
<p><strong>Step 3:</strong> \\(\\hat{p}_1=${rnd(s9.p,4)}\\), \\(\\hat{p}_2=${rnd(s10.p,4)}\\); \\(z = \\dfrac{\\hat{p}_1-\\hat{p}_2}{SE_{pool}} = \\dfrac{${rnd(s9.p-s10.p,4)}}{${rnd(SEpool,4)}} \\approx ${rnd(z910,4)}\\).</p>`});
  return probs;
}

function gen11(){
  const probs=[];
  function samp(){ return {xbar: ri(40,100), s: ri(5,20), n: ri(10,40)}; }

  let s1=samp();
  probs.push({q:`A sample has \\(\\bar{x} = ${s1.xbar}\\), \\(s = ${s1.s}\\), \\(n = ${s1.n}\\). Find the standard error of the mean, \\(SE = s/\\sqrt{n}\\).`, a: rnd(s1.s/Math.sqrt(s1.n),4), tol:0.02,
    sol:`<p>The standard error of the mean measures how much \\(\\bar{x}\\) varies from sample to sample; it divides the sample SD by \\(\\sqrt{n}\\).</p>
<p>\\(SE = \\dfrac{s}{\\sqrt{n}} = \\dfrac{${s1.s}}{\\sqrt{${s1.n}}} = \\dfrac{${s1.s}}{${rnd(Math.sqrt(s1.n),4)}} \\approx ${rnd(s1.s/Math.sqrt(s1.n),4)}\\).</p>`});

  let s2=samp(), cl2=pick([0.90,0.95,0.99]);
  let df2=s2.n-1, tcrit2=jStat.studentt.inv(1-(1-cl2)/2,df2);
  probs.push({q:`A sample has \\(n = ${s2.n}\\) (so \\(df = ${df2}\\)). Find the t critical value for a ${cl2*100}% confidence interval (two-sided).`, a: rnd(tcrit2,4), tol:0.03,
    sol:`<p>For a two-sided ${cl2*100}% CI, we need the value that cuts off \\(\\dfrac{1-${cl2}}{2}=${rnd((1-cl2)/2,3)}\\) in each tail of the t-distribution with \\(df=n-1=${df2}\\).</p>
<p>Looking this up (or computing it): \\(t_{${rnd((1-cl2)/2,3)},${df2}} \\approx ${rnd(tcrit2,4)}\\).</p>`});

  let s3=samp(), cl3=pick([0.90,0.95,0.99]);
  let df3=s3.n-1, tcrit3=jStat.studentt.inv(1-(1-cl3)/2,df3);
  let ME3 = tcrit3*s3.s/Math.sqrt(s3.n);
  probs.push({q:`A sample has \\(\\bar{x} = ${s3.xbar}\\), \\(s = ${s3.s}\\), \\(n = ${s3.n}\\). Find the margin of error for a ${cl3*100}% confidence interval for \\(\\mu\\). \\((ME = t\\cdot s/\\sqrt{n})\\)`, a: rnd(ME3,4), tol:0.05,
    sol:`<p><strong>Step 1:</strong> \\(df = n-1 = ${df3}\\); the t-critical value for ${cl3*100}% confidence is \\(t\\approx${rnd(tcrit3,4)}\\).</p>
<p><strong>Step 2:</strong> \\(ME = t\\cdot\\dfrac{s}{\\sqrt{n}} = ${rnd(tcrit3,4)}\\times\\dfrac{${s3.s}}{\\sqrt{${s3.n}}} = ${rnd(tcrit3,4)}\\times ${rnd(s3.s/Math.sqrt(s3.n),4)} \\approx ${rnd(ME3,4)}\\).</p>`});

  let s4=samp(), cl4=pick([0.90,0.95,0.99]);
  let df4=s4.n-1, tcrit4=jStat.studentt.inv(1-(1-cl4)/2,df4);
  let ME4 = tcrit4*s4.s/Math.sqrt(s4.n);
  let upper4 = s4.xbar+ME4;
  probs.push({q:`A sample has \\(\\bar{x} = ${s4.xbar}\\), \\(s = ${s4.s}\\), \\(n = ${s4.n}\\). Find the upper bound of the ${cl4*100}% confidence interval for \\(\\mu\\).`, a: rnd(upper4,4), tol:0.05,
    sol:`<p><strong>Step 1:</strong> \\(df=${df4}\\); \\(t_{crit}\\approx${rnd(tcrit4,4)}\\) for ${cl4*100}% confidence.</p>
<p><strong>Step 2:</strong> \\(ME = t\\cdot s/\\sqrt{n} = ${rnd(tcrit4,4)}\\times ${s4.s}/\\sqrt{${s4.n}} \\approx ${rnd(ME4,4)}\\).</p>
<p><strong>Step 3:</strong> the CI is \\(\\bar{x}\\pm ME\\), so the upper bound is \\(\\bar{x}+ME = ${s4.xbar} + ${rnd(ME4,4)} \\approx ${rnd(upper4,4)}\\).</p>`});

  let s5=samp(), mu0=s5.xbar+pick([-1,1])*ri(2,6);
  let t5 = (s5.xbar-mu0)/(s5.s/Math.sqrt(s5.n));
  probs.push({q:`A sample has \\(\\bar{x} = ${s5.xbar}\\), \\(s = ${s5.s}\\), \\(n = ${s5.n}\\). Test \\(H_0: \\mu = ${mu0}\\) vs \\(H_1: \\mu \\ne ${mu0}\\). Find the test statistic \\(t = \\dfrac{\\bar{x} - \\mu_0}{s/\\sqrt{n}}\\).`, a: rnd(t5,4), tol:0.03,
    sol:`<p>Plug \\(\\bar{x}\\), \\(\\mu_0\\), \\(s\\), and \\(n\\) directly into the formula.</p>
<p>\\(t = \\dfrac{${s5.xbar}-${mu0}}{${s5.s}/\\sqrt{${s5.n}}} = \\dfrac{${s5.xbar-mu0}}{${rnd(s5.s/Math.sqrt(s5.n),4)}} \\approx ${rnd(t5,4)}\\), with \\(df=n-1=${s5.n-1}\\).</p>`});
  return probs;
}

function gen12(){
  const probs=[];
  function samp(){ return {xbar: ri(40,100), s: ri(5,20), n: ri(10,35)}; }
  function welchDf(s1,s2){
    let num = Math.pow(s1.s*s1.s/s1.n + s2.s*s2.s/s2.n, 2);
    let den = Math.pow(s1.s*s1.s/s1.n,2)/(s1.n-1) + Math.pow(s2.s*s2.s/s2.n,2)/(s2.n-1);
    return num/den;
  }

  let a1=samp(), b1=samp();
  probs.push({q:`Sample 1: \\(\\bar{x}_1{=}${a1.xbar}\\), \\(s_1{=}${a1.s}\\), \\(n_1{=}${a1.n}\\). Sample 2: \\(\\bar{x}_2{=}${b1.xbar}\\), \\(s_2{=}${b1.s}\\), \\(n_2{=}${b1.n}\\). Find the difference in sample means, \\(\\bar{x}_1 - \\bar{x}_2\\).`, a: rnd(a1.xbar-b1.xbar,4), tol:0.05,
    sol:`<p>Simply subtract the two sample means.</p>
<p>\\(\\bar{x}_1-\\bar{x}_2 = ${a1.xbar} - ${b1.xbar} = ${rnd(a1.xbar-b1.xbar,4)}\\).</p>`});

  let a2=samp(), b2=samp();
  let SE2 = Math.sqrt(a2.s*a2.s/a2.n + b2.s*b2.s/b2.n);
  probs.push({q:`Sample 1: \\(s_1{=}${a2.s}\\), \\(n_1{=}${a2.n}\\). Sample 2: \\(s_2{=}${b2.s}\\), \\(n_2{=}${b2.n}\\). Find the (Welch, unpooled) standard error: \\(SE = \\sqrt{s_1^2/n_1 + s_2^2/n_2}\\).`, a: rnd(SE2,4), tol:0.02,
    sol:`<p>Each sample contributes its own variance-over-n term; we don't assume the population variances are equal, so nothing is pooled.</p>
<p>\\(SE = \\sqrt{\\dfrac{${a2.s}^2}{${a2.n}} + \\dfrac{${b2.s}^2}{${b2.n}}} = \\sqrt{${rnd(a2.s*a2.s/a2.n,4)} + ${rnd(b2.s*b2.s/b2.n,4)}} = \\sqrt{${rnd(a2.s*a2.s/a2.n+b2.s*b2.s/b2.n,4)}} \\approx ${rnd(SE2,4)}\\).</p>`});

  let a3=samp(), b3=samp();
  let df3 = welchDf(a3,b3);
  let v1_3 = a3.s*a3.s/a3.n, v2_3 = b3.s*b3.s/b3.n;
  probs.push({q:`Sample 1: \\(s_1{=}${a3.s}\\), \\(n_1{=}${a3.n}\\). Sample 2: \\(s_2{=}${b3.s}\\), \\(n_2{=}${b3.n}\\). Find the Welch\u2013Satterthwaite degrees of freedom (round to the nearest whole number).`, a: Math.round(df3), tol:1,
    sol:`<p><strong>Step 1</strong> \u2014 compute \\(v_1=s_1^2/n_1 = ${a3.s}^2/${a3.n} = ${rnd(v1_3,4)}\\) and \\(v_2=s_2^2/n_2 = ${b3.s}^2/${b3.n} = ${rnd(v2_3,4)}\\).</p>
<p><strong>Step 2</strong> \u2014 apply the Welch\u2013Satterthwaite formula: \\(df = \\dfrac{(v_1+v_2)^2}{\\dfrac{v_1^2}{n_1-1}+\\dfrac{v_2^2}{n_2-1}} = \\dfrac{(${rnd(v1_3,4)}+${rnd(v2_3,4)})^2}{\\dfrac{${rnd(v1_3,4)}^2}{${a3.n-1}}+\\dfrac{${rnd(v2_3,4)}^2}{${b3.n-1}}} \\approx ${rnd(df3,2)}\\), which rounds to <strong>${Math.round(df3)}</strong>.</p>`});

  let a4=samp(), b4=samp();
  let SE4 = Math.sqrt(a4.s*a4.s/a4.n + b4.s*b4.s/b4.n);
  let t4 = (a4.xbar-b4.xbar)/SE4;
  probs.push({q:`Sample 1: \\(\\bar{x}_1{=}${a4.xbar}\\), \\(s_1{=}${a4.s}\\), \\(n_1{=}${a4.n}\\). Sample 2: \\(\\bar{x}_2{=}${b4.xbar}\\), \\(s_2{=}${b4.s}\\), \\(n_2{=}${b4.n}\\). Test \\(H_0: \\mu_1 = \\mu_2\\) vs \\(H_1: \\mu_1 \\ne \\mu_2\\). Find the Welch test statistic \\(t = (\\bar{x}_1-\\bar{x}_2)/SE\\).`, a: rnd(t4,4), tol:0.04,
    sol:`<p><strong>Step 1 \u2014 SE:</strong> \\(SE = \\sqrt{${a4.s}^2/${a4.n} + ${b4.s}^2/${b4.n}} \\approx ${rnd(SE4,4)}\\).</p>
<p><strong>Step 2 \u2014 test statistic:</strong> \\(t = \\dfrac{\\bar{x}_1-\\bar{x}_2}{SE} = \\dfrac{${a4.xbar}-${b4.xbar}}{${rnd(SE4,4)}} = \\dfrac{${rnd(a4.xbar-b4.xbar,4)}}{${rnd(SE4,4)}} \\approx ${rnd(t4,4)}\\).</p>`});

  let a5=samp(), b5=samp(), cl5=pick([0.90,0.95,0.99]);
  let SE5 = Math.sqrt(a5.s*a5.s/a5.n + b5.s*b5.s/b5.n);
  let df5 = welchDf(a5,b5);
  let tcrit5 = jStat.studentt.inv(1-(1-cl5)/2, df5);
  let ME5 = tcrit5*SE5;
  probs.push({q:`Sample 1: \\(\\bar{x}_1{=}${a5.xbar}\\), \\(s_1{=}${a5.s}\\), \\(n_1{=}${a5.n}\\). Sample 2: \\(\\bar{x}_2{=}${b5.xbar}\\), \\(s_2{=}${b5.s}\\), \\(n_2{=}${b5.n}\\). Using the Welch\u2013Satterthwaite df (rounded to the nearest whole number), find the margin of error for a ${cl5*100}% confidence interval for \\(\\mu_1-\\mu_2\\).`, a: rnd(ME5,4), tol:0.15,
    sol:`<p><strong>Step 1 \u2014 SE:</strong> \\(SE = \\sqrt{${a5.s}^2/${a5.n}+${b5.s}^2/${b5.n}} \\approx ${rnd(SE5,4)}\\).</p>
<p><strong>Step 2 \u2014 Welch df:</strong> \\(df \\approx ${rnd(df5,2)}\\), which rounds to ${Math.round(df5)}.</p>
<p><strong>Step 3 \u2014 t-critical:</strong> for ${cl5*100}% confidence with \\(df=${Math.round(df5)}\\), \\(t\\approx${rnd(tcrit5,4)}\\).</p>
<p><strong>Step 4 \u2014 margin of error:</strong> \\(ME = t\\times SE = ${rnd(tcrit5,4)}\\times${rnd(SE5,4)} \\approx ${rnd(ME5,4)}\\).</p>`});
  return probs;
}

// ===== Topic 13 =====
function gen13(){
  const probs=[];
  function gofSet(){
    let k=ri(3,5);
    let obs=[]; for(let i=0;i<k;i++) obs.push(ri(15,60));
    let total=obs.reduce((a,b)=>a+b,0);
    let exp=obs.map(()=>total/k);
    let chi2=obs.reduce((s,o,i)=>s+Math.pow(o-exp[i],2)/exp[i],0);
    return {k,obs,exp,total,chi2};
  }
  let g1=gofSet();
  let terms1 = g1.obs.map((o,i)=>rnd(Math.pow(o-g1.exp[i],2)/g1.exp[i],4));
  probs.push({q:`A die-fairness style test has observed counts across ${g1.k} categories: {${g1.obs.join(', ')}} (total \\(n = ${g1.total}\\)). Under \\(H_0\\), the categories are equally likely, so each expected count is \\(n/${g1.k} = ${rnd(g1.total/g1.k,2)}\\). Find the chi-square goodness-of-fit statistic \\(\\chi^2 = \\sum (O-E)^2/E\\).`, a: rnd(g1.chi2,4), tol:0.05,
    sol:`<p>Each category's expected count is \\(E = ${rnd(g1.total/g1.k,2)}\\). For each category, compute \\((O-E)^2/E\\):</p>
<p>${g1.obs.map((o,i)=>`\\(\\dfrac{(${o}-${rnd(g1.exp[i],2)})^2}{${rnd(g1.exp[i],2)}} = ${terms1[i]}\\)`).join('; ')}.</p>
<p>Sum these terms: \\(\\chi^2 = ${terms1.join(' + ')} = ${rnd(g1.chi2,4)}\\).</p>`});

  let g2=gofSet();
  probs.push({q:`A goodness-of-fit test uses ${g2.k} categories. Find the degrees of freedom for the test.`, a: g2.k-1, tol:0.4,
    sol:`<p>A GOF test has \\(df = (\\text{number of categories}) - 1\\) (one degree of freedom is "used up" because the expected counts must add up to the same total \\(n\\) as the observed counts).</p>
<p>\\(df = ${g2.k} - 1 = ${g2.k-1}\\).</p>`});

  function indTable(){
    let r=2, c=pick([2,3]);
    let rowTot=[], colTot=[];
    let table=[];
    for(let i=0;i<r;i++){ table.push([]); }
    for(let i=0;i<r;i++) for(let j=0;j<c;j++) table[i][j]=ri(10,40);
    for(let i=0;i<r;i++) rowTot.push(table[i].reduce((a,b)=>a+b,0));
    for(let j=0;j<c;j++){ let s=0; for(let i=0;i<r;i++) s+=table[i][j]; colTot.push(s); }
    let grand = rowTot.reduce((a,b)=>a+b,0);
    return {r,c,table,rowTot,colTot,grand};
  }
  let it3=indTable();
  let ci=ri(0,it3.r-1), cj=ri(0,it3.c-1);
  let expCell = (it3.rowTot[ci]*it3.colTot[cj])/it3.grand;
  let tableTxt3 = it3.table.map((row,i)=>`Row ${i+1}: {${row.join(', ')}}`).join('; ');
  probs.push({q:`A \\(${it3.r}\\times${it3.c}\\) contingency table has observed counts \u2014 ${tableTxt3} (row totals: {${it3.rowTot.join(', ')}}; column totals: {${it3.colTot.join(', ')}}; grand total = ${it3.grand}). For a chi-square test of independence, find the expected count for the cell in row ${ci+1}, column ${cj+1}. \\((E = \\text{row total} \\times \\text{column total} / \\text{grand total})\\)`, a: rnd(expCell,4), tol:0.05,
    sol:`<p>Under \\(H_0\\) (independence), the expected count for a cell is proportional to its row and column totals.</p>
<p>\\(E_{${ci+1},${cj+1}} = \\dfrac{\\text{row ${ci+1} total} \\times \\text{column ${cj+1} total}}{\\text{grand total}} = \\dfrac{${it3.rowTot[ci]}\\times${it3.colTot[cj]}}{${it3.grand}} = \\dfrac{${it3.rowTot[ci]*it3.colTot[cj]}}{${it3.grand}} \\approx ${rnd(expCell,4)}\\).</p>`});

  let it4=indTable();
  let chi2ind=0;
  let expTable=[];
  let cellTerms=[];
  for(let i=0;i<it4.r;i++){ expTable.push([]); for(let j=0;j<it4.c;j++){ let e=(it4.rowTot[i]*it4.colTot[j])/it4.grand; expTable[i].push(rnd(e,3)); let term=rnd(Math.pow(it4.table[i][j]-e,2)/e,4); cellTerms.push(term); chi2ind += Math.pow(it4.table[i][j]-e,2)/e; } }
  let tableTxt4 = it4.table.map((row,i)=>`Row ${i+1}: {${row.join(', ')}}`).join('; ');
  let expTxt4 = expTable.map((row,i)=>`Row ${i+1}: {${row.join(', ')}}`).join('; ');
  probs.push({q:`A \\(${it4.r}\\times${it4.c}\\) contingency table has observed counts \u2014 ${tableTxt4} (row totals: {${it4.rowTot.join(', ')}}; column totals: {${it4.colTot.join(', ')}}; grand total = ${it4.grand}). Find the chi-square test statistic for independence, \\(\\chi^2 = \\sum (O-E)^2/E\\).`, a: rnd(chi2ind,4), tol:0.1,
    sol:`<p><strong>Step 1 \u2014 expected counts</strong> (row total \\(\\times\\) column total \\(/\\) grand total) for every cell: ${expTxt4}.</p>
<p><strong>Step 2 \u2014</strong> compute \\((O-E)^2/E\\) for each of the ${it4.r*it4.c} cells and sum them: ${cellTerms.join(' + ')} = ${rnd(chi2ind,4)}.</p>
<p>\\(\\chi^2 \\approx ${rnd(chi2ind,4)}\\), with \\(df=(${it4.r}-1)(${it4.c}-1)=${(it4.r-1)*(it4.c-1)}\\).</p>`});

  let it5=indTable();
  probs.push({q:`For a chi-square test of independence on a \\(${it5.r}\\times${it5.c}\\) contingency table, find the degrees of freedom, \\(df = (r-1)(c-1)\\).`, a: (it5.r-1)*(it5.c-1), tol:0.4,
    sol:`<p>Substitute the number of rows and columns into the formula.</p>
<p>\\(df = (r-1)(c-1) = (${it5.r}-1)(${it5.c}-1) = ${it5.r-1}\\times${it5.c-1} = ${(it5.r-1)*(it5.c-1)}\\).</p>`});
  return probs;
}

function buildMC(correctText, distractors){
  let choices = [correctText, ...distractors];
  for(let i=choices.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [choices[i],choices[j]]=[choices[j],choices[i]]; }
  let correct = choices.indexOf(correctText);
  return {choices, correct};
}

// ===== Topic 14 =====
function gen14(){
  const probs=[];
  let k=ri(3,6), n=ri(k*5+3, k*10);
  let dfT=k-1, dfE=n-k;
  let mc1=buildMC(`\\(df(\\text{treatment}) = ${dfT}\\), \\(df(\\text{error}) = ${dfE}\\)`, [
    `\\(df(\\text{treatment}) = ${k}\\), \\(df(\\text{error}) = ${n-k-1}\\)`,
    `\\(df(\\text{treatment}) = ${dfT}\\), \\(df(\\text{error}) = ${n}\\)`,
    `\\(df(\\text{treatment}) = ${n-k}\\), \\(df(\\text{error}) = ${dfT}\\)`
  ]);
  probs.push({q:`In a one-way ANOVA with \\(k = ${k}\\) groups and a total of \\(n = ${n}\\) observations, what are the degrees of freedom for treatment and error?`, choices:mc1.choices, correct:mc1.correct,
    sol:`<p>\\(df(\\text{treatment}) = k-1 = ${k}-1 = ${dfT}\\) (one less than the number of groups). \\(df(\\text{error}) = n-k = ${n}-${k} = ${dfE}\\) (total observations minus the number of groups). Together they add to \\(df(\\text{total})=n-1=${n-1}\\).</p>`});

  let SST=ri(150,400), SSE=ri(50,SST-30);
  let SSTr=SST-SSE;
  let mc2=buildMC(`\\(SSTr = ${SSTr}\\)`, [`\\(SSTr = ${SST+SSE}\\)`, `\\(SSTr = ${SSE-SST}\\)`, `\\(SSTr = ${SST}\\)`]);
  probs.push({q:`In a one-way ANOVA, \\(SST\\) (total sum of squares) \\(= ${SST}\\) and \\(SSE\\) (error sum of squares) \\(= ${SSE}\\). Since \\(SST = SSTr + SSE\\), what is \\(SSTr\\) (treatment sum of squares)?`, choices:mc2.choices, correct:mc2.correct,
    sol:`<p>Rearrange the sum-of-squares identity: \\(SSTr = SST - SSE = ${SST} - ${SSE} = ${SSTr}\\).</p>`});

  let MSTr=ri(20,60), MSE=ri(5,19);
  let F=rnd(MSTr/MSE,2);
  let distract=[rnd(MSE/MSTr,2), rnd(MSTr+MSE,2), rnd(MSTr-MSE,2)];
  let mc3=buildMC(`\\(F = ${F}\\)`, distract.map(d=>`\\(F = ${d}\\)`));
  probs.push({q:`In a one-way ANOVA, \\(MSTr\\) (mean square treatment) \\(= ${MSTr}\\) and \\(MSE\\) (mean square error) \\(= ${MSE}\\). What is the F test statistic, \\(F = MSTr/MSE\\)?`, choices:mc3.choices, correct:mc3.correct,
    sol:`<p>Divide the mean square for treatment by the mean square for error.</p>
<p>\\(F = \\dfrac{MSTr}{MSE} = \\dfrac{${MSTr}}{${MSE}} = ${F}\\).</p>`});

  let mc4=buildMC(`All population (group) means are equal: \\(\\mu_1 = \\mu_2 = \\cdots = \\mu_k\\)`, [
    `All population variances are equal`,
    `At least one pair of sample means is equal`,
    `The overall sample mean equals zero`
  ]);
  probs.push({q:`What is the null hypothesis \\(H_0\\) tested by a one-way ANOVA?`, choices:mc4.choices, correct:mc4.correct,
    sol:`<p>One-way ANOVA compares \\(k\\) group means simultaneously. \\(H_0\\) states there is no difference among the groups: \\(\\mu_1=\\mu_2=\\cdots=\\mu_k\\). The alternative, \\(H_1\\), is simply that at least one group mean differs from the others (not necessarily all of them).</p>`});

  let alpha=pick([0.01,0.05,0.10]);
  let Fstat=rf(1.5,6,2);
  let Fcrit=rf(2.0,3.5,2);
  let reject = Fstat>Fcrit;
  let mc5=buildMC(reject? `Reject \\(H_0\\), since \\(F = ${Fstat} > F\\text{-critical} = ${Fcrit}\\)` : `Fail to reject \\(H_0\\), since \\(F = ${Fstat} \\le F\\text{-critical} = ${Fcrit}\\)`, [
    reject? `Fail to reject \\(H_0\\), since \\(F = ${Fstat} > F\\text{-critical} = ${Fcrit}\\)` : `Reject \\(H_0\\), since \\(F = ${Fstat} \\le F\\text{-critical} = ${Fcrit}\\)`,
    `Reject \\(H_1\\), since the p-value is small`,
    `No decision can be made without the sample means`
  ]);
  probs.push({q:`A one-way ANOVA at \\(\\alpha = ${alpha}\\) produces test statistic \\(F = ${Fstat}\\), with F-critical \\(= ${Fcrit}\\). What is the correct conclusion?`, choices:mc5.choices, correct:mc5.correct,
    sol:`<p>The decision rule for ANOVA: reject \\(H_0\\) if \\(F > F_{crit}\\) (a large F means the between-group variation is large relative to within-group variation, which is unlikely if all means were truly equal).</p>
<p>Here \\(F=${Fstat}\\) ${reject? '>' : '\\le'} \\(F_{crit}=${Fcrit}\\), so we <strong>${reject? 'reject' : 'fail to reject'} \\(H_0\\)</strong>.</p>`});
  return probs;
}

// ===== Topic 15 =====
function gen15(){
  const probs=[];
  let b0=ri(2,20), b1=rf(0.5,4,2), x0=ri(3,15);
  let yhat=rnd(b0+b1*x0,2);
  let mc1=buildMC(`\\(\\hat{y} = ${yhat}\\)`, [`\\(\\hat{y} = ${rnd(b0-b1*x0,2)}\\)`, `\\(\\hat{y} = ${rnd(b1+b0*x0,2)}\\)`, `\\(\\hat{y} = ${rnd(b0*b1*x0,2)}\\)`]);
  probs.push({q:`The fitted regression line is \\(\\hat{y} = ${b0} + ${b1}x\\). What is the predicted value of y when \\(x = ${x0}\\)?`, choices:mc1.choices, correct:mc1.correct,
    sol:`<p>Substitute \\(x=${x0}\\) directly into the fitted equation.</p>
<p>\\(\\hat{y} = ${b0} + ${b1}(${x0}) = ${b0} + ${rnd(b1*x0,2)} = ${yhat}\\).</p>`});

  let b1b=rf(1,8,2), unitY=pick(['dollars','points','minutes','units']), unitX=pick(['hour','year','item','session']);
  let mc2=buildMC(`For each additional ${unitX}, the predicted y increases by ${b1b} ${unitY}, on average`, [
    `The predicted y increases by ${b1b}% for every unit increase in x`,
    `When x = 0, y is predicted to be ${b1b}`,
    `The correlation between x and y is ${b1b}`
  ]);
  probs.push({q:`In a simple linear regression \\(\\hat{y} = b_0 + ${b1b}x\\), how should the slope ${b1b} be interpreted?`, choices:mc2.choices, correct:mc2.correct,
    sol:`<p>In simple linear regression, the slope \\(b_1\\) is the average change in \\(\\hat y\\) for a one-unit increase in \\(x\\) \u2014 it's a rate, not a percentage, and it doesn't by itself tell you the value at \\(x=0\\) (that's \\(b_0\\)) or the correlation. So the slope ${b1b} means: for each additional ${unitX}, the predicted y increases by ${b1b} ${unitY}, on average.</p>`});

  let r2=rf(0.4,0.95,2);
  let pct=rnd(r2*100,1);
  let mc3=buildMC(`${pct}% of the variability in y is explained by the regression model`, [
    `${pct}% of the data points fall exactly on the regression line`,
    `The correlation between x and y is ${pct}`,
    `${pct}% of the residuals are positive`
  ]);
  probs.push({q:`A simple linear regression model has \\(R^2 = ${r2}\\). What does this value mean?`, choices:mc3.choices, correct:mc3.correct,
    sol:`<p>\\(R^2\\) is the <strong>proportion of variability in y explained by the model</strong>, expressed here as a percentage: \\(${r2}\\times100\\% = ${pct}\\%\\). It says nothing about how many points sit exactly on the line, nor is it the correlation itself (though for simple regression, \\(R^2 = \\rho^2\\)), nor does it describe the sign pattern of residuals.</p>`});

  let yobs=ri(20,80), b0c=ri(5,20), b1c=rf(0.5,3,2), xc=ri(3,15);
  let yhatC=rnd(b0c+b1c*xc,2);
  let resid=rnd(yobs-yhatC,2);
  let mc4=buildMC(`residual \\(= ${resid}\\)`, [`residual \\(= ${rnd(yhatC-yobs,2)}\\)`, `residual \\(= ${rnd(yobs+yhatC,2)}\\)`, `residual \\(= ${yobs}\\)`]);
  probs.push({q:`For an observation with \\(x = ${xc}\\) and observed \\(y = ${yobs}\\), the fitted line gives \\(\\hat{y} = ${b0c} + ${b1c}x\\). What is the residual (observed \u2212 predicted) for this point?`, choices:mc4.choices, correct:mc4.correct,
    sol:`<p><strong>Step 1 \u2014 predicted value:</strong> \\(\\hat y = ${b0c} + ${b1c}(${xc}) = ${b0c} + ${rnd(b1c*xc,2)} = ${yhatC}\\).</p>
<p><strong>Step 2 \u2014 residual:</strong> residual \\(=\\) observed \\(-\\) predicted \\(= ${yobs} - ${yhatC} = ${resid}\\).</p>`});

  let mc5=buildMC(`Holding all other predictors constant, y is predicted to change by that coefficient's value for a one-unit increase in that predictor`, [
    `That predictor alone determines the value of y`,
    `The coefficient is always equal to the correlation between that predictor and y`,
    `A larger coefficient always means that predictor is more statistically significant`
  ]);
  probs.push({q:`In a multiple regression model \\(\\hat{y} = b_0 + b_1x_1 + b_2x_2 + \\cdots\\), how is each coefficient \\(b_i\\) \\((i \\ge 1)\\) interpreted?`, choices:mc5.choices, correct:mc5.correct,
    sol:`<p>With multiple predictors, changing one predictor typically also correlates with the others, so we interpret each slope <strong>"holding all other predictors constant"</strong>: a one-unit increase in \\(x_i\\) is associated with a \\(b_i\\)-unit change in the predicted y, with every other predictor held fixed. A coefficient's size alone (without standardizing) doesn't tell you statistical significance, and no single predictor "determines" y on its own.</p>`});
  return probs;
}

// ===== Topic 16 =====
const CONTROL_CONSTANTS = {
  2:{A2:1.880,D3:0,D4:3.267}, 3:{A2:1.023,D3:0,D4:2.574}, 4:{A2:0.729,D3:0,D4:2.282},
  5:{A2:0.577,D3:0,D4:2.114}, 6:{A2:0.483,D3:0,D4:2.004}, 7:{A2:0.419,D3:0.076,D4:1.924},
  8:{A2:0.373,D3:0.136,D4:1.864}, 9:{A2:0.337,D3:0.184,D4:1.816}, 10:{A2:0.308,D3:0.223,D4:1.777}
};
function gen16(){
  const probs=[];
  let n=pick([2,3,4,5,6]);
  let xbarbar=ri(40,100), Rbar=ri(3,15);
  let A2=CONTROL_CONSTANTS[n].A2;
  let UCL=rnd(xbarbar+A2*Rbar,3);
  let mc1=buildMC(`\\(UCL = ${UCL}\\)`, [`\\(UCL = ${rnd(xbarbar-A2*Rbar,3)}\\)`, `\\(UCL = ${rnd(xbarbar*A2*Rbar,3)}\\)`, `\\(UCL = ${rnd(xbarbar+Rbar,3)}\\)`]);
  probs.push({q:`For an \\(\\bar{x}\\)-chart with subgroup size \\(n = ${n}\\), the grand mean is \\(\\bar{\\bar{x}} = ${xbarbar}\\) and the average range is \\(\\bar{R} = ${Rbar}\\) \\((A_2 = ${A2}\\) for \\(n = ${n})\\). Find the upper control limit, \\(UCL = \\bar{\\bar{x}} + A_2\\bar{R}\\).`, choices:mc1.choices, correct:mc1.correct,
    sol:`<p>Look up \\(A_2=${A2}\\) for subgroup size \\(n=${n}\\), then plug into the formula.</p>
<p>\\(UCL = \\bar{\\bar{x}} + A_2\\bar{R} = ${xbarbar} + (${A2})(${Rbar}) = ${xbarbar} + ${rnd(A2*Rbar,3)} = ${UCL}\\).</p>`});

  let n2=pick([2,3,4,5,6]);
  let xbarbar2=ri(40,100), Rbar2=ri(3,15);
  let A2b=CONTROL_CONSTANTS[n2].A2;
  let LCL2=rnd(xbarbar2-A2b*Rbar2,3);
  let mc2=buildMC(`\\(LCL = ${LCL2}\\)`, [`\\(LCL = ${rnd(xbarbar2+A2b*Rbar2,3)}\\)`, `\\(LCL = ${rnd(xbarbar2-Rbar2,3)}\\)`, `\\(LCL = ${rnd(xbarbar2/A2b,3)}\\)`]);
  probs.push({q:`For an \\(\\bar{x}\\)-chart with subgroup size \\(n = ${n2}\\), \\(\\bar{\\bar{x}} = ${xbarbar2}\\), \\(\\bar{R} = ${Rbar2}\\), and \\(A_2 = ${A2b}\\). Find the lower control limit, \\(LCL = \\bar{\\bar{x}} - A_2\\bar{R}\\).`, choices:mc2.choices, correct:mc2.correct,
    sol:`<p>Same formula as the UCL but subtracting the \\(A_2\\bar{R}\\) term instead of adding it.</p>
<p>\\(LCL = \\bar{\\bar{x}} - A_2\\bar{R} = ${xbarbar2} - (${A2b})(${Rbar2}) = ${xbarbar2} - ${rnd(A2b*Rbar2,3)} = ${LCL2}\\).</p>`});

  let n3=pick([2,3,4,5,6,7,8]);
  let Rbar3=ri(4,18);
  let D4=CONTROL_CONSTANTS[n3].D4;
  let UCLr=rnd(D4*Rbar3,3);
  let mc3=buildMC(`\\(UCL = ${UCLr}\\)`, [`\\(UCL = ${rnd(Rbar3/D4,3)}\\)`, `\\(UCL = ${rnd(D4+Rbar3,3)}\\)`, `\\(UCL = ${rnd(CONTROL_CONSTANTS[n3].D3*Rbar3,3)}\\)`]);
  probs.push({q:`For an R-chart with subgroup size \\(n = ${n3}\\) and \\(\\bar{R} = ${Rbar3}\\) \\((D_4 = ${D4}\\) for \\(n = ${n3})\\), find the upper control limit, \\(UCL = D_4\\bar{R}\\).`, choices:mc3.choices, correct:mc3.correct,
    sol:`<p>The R-chart's UCL is simply the table constant \\(D_4\\) times the average range.</p>
<p>\\(UCL = D_4\\bar{R} = (${D4})(${Rbar3}) = ${UCLr}\\).</p>`});

  let n4=ri(80,200), pbar=rf(0.02,0.12,3);
  let sigp=Math.sqrt(pbar*(1-pbar)/n4);
  let UCLp=rnd(Math.min(1,pbar+3*sigp),4);
  let LCLp=rnd(Math.max(0,pbar-3*sigp),4);
  let mc4=buildMC(`\\(UCL = ${UCLp}\\), \\(LCL = ${LCLp}\\)`, [
    `\\(UCL = ${rnd(pbar+2*sigp,4)}\\), \\(LCL = ${rnd(pbar-2*sigp,4)}\\)`,
    `\\(UCL = ${rnd(pbar+3*sigp,4)}\\), \\(LCL = 0.05\\)`,
    `\\(UCL = ${rnd(1-pbar,4)}\\), \\(LCL = ${rnd(pbar,4)}\\)`
  ]);
  probs.push({q:`For a p-chart with subgroup size \\(n = ${n4}\\) and center line \\(\\bar{p} = ${pbar}\\), the control limits are \\(\\bar{p} \\pm 3\\sqrt{\\bar{p}(1-\\bar{p})/n}\\) (bounded within \\([0,1]\\)). Find the UCL and LCL.`, choices:mc4.choices, correct:mc4.correct,
    sol:`<p><strong>Step 1 \u2014 standard deviation of \\(\\hat p\\):</strong> \\(\\sigma_{\\hat p} = \\sqrt{\\dfrac{\\bar p(1-\\bar p)}{n}} = \\sqrt{\\dfrac{${pbar}(${rnd(1-pbar,3)})}{${n4}}} \\approx ${rnd(sigp,5)}\\).</p>
<p><strong>Step 2 \u2014 control limits (\\(\\pm3\\) standard deviations):</strong> \\(UCL = ${pbar} + 3(${rnd(sigp,5)}) \\approx ${UCLp}\\); \\(LCL = ${pbar} - 3(${rnd(sigp,5)}) \\approx ${LCLp}\\)${LCLp<=0?' (bounded at 0 since a proportion cannot be negative)':''}.</p>`});

  let mc5=buildMC(`A point falls outside the control limits (or a nonrandom pattern such as a run appears)`, [
    `Every point falls exactly on the center line`,
    `The sample size is smaller than 30`,
    `The process standard deviation equals zero`
  ]);
  probs.push({q:`Which of the following is a signal that a process may be "out of control" on a control chart?`, choices:mc5.choices, correct:mc5.correct,
    sol:`<p>A control chart flags a process as possibly out of control when a plotted point falls outside the \\(UCL\\)/\\(LCL\\) bounds, or when the points show a nonrandom pattern (such as a run of points steadily increasing, or several points on the same side of the center line) \u2014 both are statistically unlikely if the process were stable and only subject to natural random variation.</p>`});
  return probs;
}
