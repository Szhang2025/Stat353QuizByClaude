          allBtns.forEach((b,i) => {
            b.disabled = true;
            if(i === p.correct) b.classList.add('correct');
          });
          if(cIdx !== p.correct){ cb.classList.add('incorrect'); }
          if(p.sol){
            solBox.classList.add('show');
            typesetMath(solBox);
          }
        });
        choicesBox.appendChild(cb);
      });
    } else {
      card.innerHTML = `
        <div class="pnum">Problem ${idx+1} of 5</div>
        <div class="qtext">${p.q}</div>
        <div class="answer-row">
          <input type="text" id="ans-${idx}" placeholder="Your answer" inputmode="decimal">
          <button class="btn btn-sm" data-idx="${idx}">Check</button>
          <button class="btn-solution" data-sol-idx="${idx}">Show solution</button>
        </div>
        <div class="feedback" id="fb-${idx}"></div>
        <div class="solution-box" id="sol-${idx}">
          <div class="sol-label">Solution</div>
          ${p.sol || '<p>No worked solution available for this problem.</p>'}
        </div>
      `;
      box.appendChild(card);
      const checkBtn = card.querySelector('button[data-idx]');
      const submit = () => checkCalcAnswer(idx, p);
      checkBtn.addEventListener('click', submit);
      card.querySelector(`#ans-${idx}`).addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
      const solBtn = card.querySelector('button[data-sol-idx]');
      const solBox = card.querySelector(`#sol-${idx}`);
      solBtn.addEventListener('click', () => {
        const nowShown = solBox.classList.toggle('show');
        solBtn.textContent = nowShown ? 'Hide solution' : 'Show solution';
        if(nowShown) typesetMath(solBox);
      });
    }
  });
  typesetMath(box);
}

function checkCalcAnswer(idx, problem){
  const input = document.getElementById('ans-' + idx);
  const fb = document.getElementById('fb-' + idx);
  const val = parseFloat(input.value);
  fb.classList.remove('good','bad');
  fb.classList.add('show');
  if(isNaN(val)){
    fb.classList.add('bad');
    fb.textContent = 'Please enter a numeric answer.';
    return;
  }
  const tol = (problem.tol !== undefined) ? problem.tol : Math.max(0.01, Math.abs(problem.a)*0.02);
  const correct = Math.abs(val - problem.a) <= tol;
  if(correct){
    fb.classList.add('good');
    fb.textContent = `Correct! (Answer: ${problem.a})`;
  } else {
    fb.classList.add('bad');
    fb.textContent = `Not quite. The correct answer is ${problem.a}.`;
  }
}

function initApp(){
  const nav = document.getElementById('topicNav');
  nav.innerHTML = '';
  TOPICS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'topic-btn' + (t.id === currentTopicId ? ' active' : '');
    b.dataset.id = t.id;
    const shortTitle = t.title.replace(/^\d+\.\s*/, '');
    b.innerHTML = `<span class="num">${t.id.toString().padStart(2,'0')}</span><span>${shortTitle}</span>`;
    b.addEventListener('click', () => selectTopic(t.id));
    nav.appendChild(b);
  });
  document.getElementById('regenBtn').addEventListener('click', () => renderProblems());
  document.getElementById('examplesBtn').addEventListener('click', openExamplesModal);
  document.getElementById('modalClose').addEventListener('click', closeExamplesModal);
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'modalOverlay') closeExamplesModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeExamplesModal();
  });
  selectTopic(currentTopicId);
  
  // ===== CHAT LOGIC =====
  const PROXY_URL = "https://script.google.com/macros/s/AKfycbxSRD8ayq-zRW4mFOtxYvwNAibpQDLHdh4_1xEl1Xs9HL7qUhIW4t8Y1yL9zi1BZF-L/exec";
  let conversationHistory = [];

  // ===== FORMAT RESPONSE =====
  function formatResponse(text) {
  let html = text;
  
  // ===== FIRST: Protect LaTeX from being modified =====
  // Replace LaTeX delimiters with placeholders
  html = html.replace(/\\\(/g, 'MATHJAX_INLINE_START');
  html = html.replace(/\\\)/g, 'MATHJAX_INLINE_END');
  html = html.replace(/\\\[/g, 'MATHJAX_DISPLAY_START');
  html = html.replace(/\\\]/g, 'MATHJAX_DISPLAY_END');
  html = html.replace(/\$\$(.*?)\$\$/g, 'MATHJAX_DISPLAY_START$1MATHJAX_DISPLAY_END');
  
  // ===== HEADERS =====
  html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');
  
  // ===== BOLD & ITALIC =====
  html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
  
  // ===== BLOCKQUOTES =====
  html = html.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/<\/blockquote>\s*<blockquote>/g, '<br>');
  
  // ===== HORIZONTAL RULES =====
  html = html.replace(/^---$/gm, '<hr>');
  html = html.replace(/^___$/gm, '<hr>');
  
  // ===== TABLES =====
  const tableRegex = /\|(.+)\|\s*\n\|[-: |]+\|\s*\n((?:\|.+\|\s*\n)+)/gm;
  html = html.replace(tableRegex, function(match, headerRow, dataRows) {
    const headers = headerRow.split('|').filter(cell => cell.trim() !== '');
    let tableHtml = '<table><thead><tr>';
    headers.forEach(h => {
      tableHtml += `<th>${h.trim()}</th>`;
    });
    tableHtml += '</tr></thead><tbody>';
    
    const rows = dataRows.trim().split('\n');
    rows.forEach(row => {
      const cells = row.split('|').filter(cell => cell.trim() !== '');
      if (cells.length > 0) {
        tableHtml += '<tr>';
        cells.forEach(cell => {
          tableHtml += `<td>${cell.trim()}</td>`;
        });
        tableHtml += '</tr>';
      }
    });
    tableHtml += '</tbody></table>';
    return tableHtml;
  });
  
  // ===== LISTS =====
  html = html.replace(/^[\*\-] (.*$)/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\s*)+)/g, '<ul>$1</ul>');
  
  html = html.replace(/^\d+\. (.*$)/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\s*)+)/g, '<ol>$1</ol>');
  
  // ===== INLINE CODE =====
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  
  // ===== LINE BREAKS =====
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  
  // ===== WRAP IN PARAGRAPHS =====
  const blockTags = ['<h1>', '<h2>', '<h3>', '<h4>', '<blockquote>', '<hr>', '<ul>', '<ol>', '<table>', '<pre>'];
  let startsWithBlock = false;
  for (const tag of blockTags) {
    if (html.trim().startsWith(tag)) {
      startsWithBlock = true;
      break;
    }
  }
  
  if (!startsWithBlock && html.trim() !== '') {
    html = '<p>' + html + '</p>';
  }
  
  // ===== CLEAN UP =====
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<li><\/li>/g, '');
  html = html.replace(/<br><\/li>/g, '</li>');
  html = html.replace(/<blockquote><\/blockquote>/g, '');
  
  // ===== RESTORE LATEX =====
  html = html.replace(/MATHJAX_INLINE_START/g, '\\(');
  html = html.replace(/MATHJAX_INLINE_END/g, '\\)');
  html = html.replace(/MATHJAX_DISPLAY_START/g, '\\[');
  html = html.replace(/MATHJAX_DISPLAY_END/g, '\\]');
  
  return html;
}
    


  async function sendToTutor(studentMessage, studentId) {
    try {
      conversationHistory.push({ role: "user", content: studentMessage });

      const response = await fetch(PROXY_URL, {
        method: "POST",
        headers: { 
          "Content-Type": "text/plain"
        },
        body: JSON.stringify({
          message: studentMessage,
          history: conversationHistory.slice(0, -1),
          studentId: studentId || "anonymous"
        })
      });

      const data = await response.json();
      
      if (data.error) {
        console.error("Tutor error:", data.error);
        return "Sorry, something went wrong — please try again.";
      }

      conversationHistory.push({ role: "assistant", content: data.reply });
      return data.reply;
    } catch (error) {
      console.error("Fetch error:", error);
      return "Error connecting to tutor service. Please try again.";
    }
  }

  const outputEl = document.getElementById("chat-output");
  const inputEl = document.getElementById("chat-input");
  const sendBtn = document.getElementById("chat-send");

  async function renderContent(element, content) {
    let html = formatResponse(content);
    element.innerHTML = html;
    
    if (window.MathJax && window.MathJax.typesetPromise) {
      try {
        await window.MathJax.typesetPromise([element]);
      } catch (err) {
        console.error('MathJax error:', err);
      }
    }
  }

  async function handleSend() {
    const message = inputEl.value.trim();
    if (!message) return;

    inputEl.value = "";
    outputEl.innerHTML = '<p><em>Thinking...</em></p>';

    try {
      const reply = await sendToTutor(message);
      await renderContent(outputEl, reply);
    } catch (error) {
      outputEl.innerHTML = '<p>❌ Error: ' + error.message + '</p>';
    }
  }

  sendBtn.addEventListener("click", handleSend);
  inputEl.addEventListener("keydown", function(e) {
    if (e.key === "Enter") handleSend();
  });

  const greeting = `I'm your AI tutor! Ask me a question about the course material! 🙈

Try asking about:
• Probability rules
• Sample spaces
• Random variables
• Hypothesis testing
• P-values
• Confidence intervals`;

  renderContent(outputEl, greeting);
}
